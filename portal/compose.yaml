services:
  bottifact:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    image: bottifact-portal:2026.09.17-atlas.1
    container_name: bottifact-portal
    restart: unless-stopped
    env_file: /volume1/docker/bottifact/config.env
    volumes:
      - /volume1/docker/bottifact/data:/data
      - /volume1/docker/bottifact/backups:/backups
      - /volume1/docker/bottifact/releases:/releases:ro
    ports:
      - "127.0.0.1:8788:8080"
    networks: [edge]
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpu_shares: 512
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  worker:
    image: bottifact-portal:2026.09.17-atlas.1
    pull_policy: never
    container_name: bottifact-worker
    command: [python, -m, portal.worker]
    restart: unless-stopped
    depends_on: [bottifact]
    env_file: /volume1/docker/bottifact/config.env
    environment:
      BOTTIFACT_BACKUP_CONFIG: /backup-config/config.env
    volumes:
      - /volume1/docker/bottifact/data:/data
      - /volume1/docker/bottifact/backups:/backups
      - /volume1/docker/bottifact/config.env:/backup-config/config.env:ro
    networks: [edge]
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}

networks:
  edge:
    external: true
    name: botto-site_default
