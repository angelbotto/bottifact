# Run from repository root with -f compose.yaml -f deploy/https.yaml.
services:
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      BOTTIFACT_DOMAIN: ${BOTTIFACT_DOMAIN:?Set BOTTIFACT_DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
volumes:
  caddy_data:
  caddy_config:
