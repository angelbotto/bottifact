name: bottifact
x-runtime: &runtime
  image: bottifact-local:${BOTTIFACT_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  read_only: true
  tmpfs: [/tmp:size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '3'}
services:
  app:
    <<: *runtime
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        APP_UID: ${BOTTIFACT_UID:-1000}
        APP_GID: ${BOTTIFACT_GID:-1000}
    ports: ["${BOTTIFACT_BIND:-127.0.0.1}:${BOTTIFACT_PORT:-8788}:8080"]
    volumes: [data:/data, backups:/backups]
    mem_limit: 768m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  worker:
    <<: *runtime
    pull_policy: never
    command: [python, -m, portal.worker]
    depends_on:
      app: {condition: service_healthy}
    volumes: [data:/data, backups:/backups]
    mem_limit: 512m
volumes:
  data:
  backups:
