name: Validar biblioteca y skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Regenerar y verificar fuentes
        run: |
          python scripts/ensamblar.py
          python scripts/validar.py
          python scripts/probar_contrato.py
          node scripts/probar_revision_store.cjs
          node scripts/probar_temas.cjs
          python scripts/validar_skill.py
          git diff --exit-code
      - name: Paquete portable
        run: python scripts/empaquetar.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bottifact-portable
          path: |
            descargas/bottifact-portable.zip
            descargas/bottifact-portable.sha256
          retention-days: 14

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r portal/requirements.lock
      - run: pip install httpx==0.28.1
      - run: python -m unittest portal.test_app -v
      - run: node --check portal/static/app.js && node --check portal/static/bridge.js
